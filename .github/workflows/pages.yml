name: Pages

# Build the project website (npm run site) and publish site/dist to GitHub Pages.
#
# Fork note (reeschan/answer-me-with-any):
# Both jobs are limited to the upstream repo. On this fork, GitHub Pages is not
# enabled, so the inherited schedule built successfully and then failed at deploy
# with "Failed to create deployment (status: 404) ... Ensure GitHub Pages has been
# enabled". The action deploys to the *current* repo, not to QingYunA's site.
# If you later want Pages on the fork, change the `if:` below to
# github.repository == 'reeschan/answer-me-with-any' and enable Pages
# (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'examples/**'
      - 'marketplace/**'
      - 'docs/images/**'
      - 'package.json'
      - 'scripts/inline-assets.mjs'
      - 'skills/answer-me-with-any/scripts/am.mjs'
      - '.github/workflows/pages.yml'
  # Rebuild once a day so the star count baked into the page stays current.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'QingYunA/answer-me-with-html'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the website
        run: npm run site
        env:
          # Lets gh read the star count shown on the page.
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.repository == 'QingYunA/answer-me-with-html'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
